# Déploiement sur Render : New + → Blueprint → choisir ce dépôt GitHub.
# La base peut être la même instance MySQL Aiven que vos autres projets : une base séparée "santemap" y est créée.
services:
  - type: web
    name: santemap
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: SEED_DEMO
        value: "true"
      - key: DB_SSL
        value: "true"
      - key: DB_NAME
        value: santemap
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSL_CA
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
